<div class="container d-flex justify-content-center align-items-center mt-5 mb-5" style="min-height: 80vh;">
  <div class="card p-4 shadow-sm text-center" style="width: 100%; max-width: 450px; border-radius: 15px; border: none;">
    
    <h2 class="fw-bold mb-4">Crear Cuenta 🚀</h2>
    
    <form>
      <div class="row mb-3 text-start">
        <div class="col-6">
          <label class="form-label fw-bold text-secondary small">Nombre</label>
          <input type="text" class="form-control" placeholder="Ej. Carlos" [(ngModel)]="nombre" name="nombre" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+" oninput="this.value = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '')">
        </div>
        <div class="col-6">
          <label class="form-label fw-bold text-secondary small">Apellidos</label>
          <input type="text" class="form-control" placeholder="Ej. Pérez" [(ngModel)]="apellidos" name="apellidos" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+" oninput="this.value = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '')">
        </div>
      </div>

      <div class="mb-3 text-start">
        <label class="form-label fw-bold text-secondary small">Número de Celular</label>
        <input type="tel" class="form-control" placeholder="Ej. 999888777" [(ngModel)]="celular" name="celular" pattern="9[0-9]{8}" maxlength="9" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
      </div>
      
      <div class="mb-3 text-start">
        <label class="form-label fw-bold text-secondary small">Correo Electrónico</label>
        <input type="email" class="form-control" placeholder="correo@ejemplo.com" [(ngModel)]="correo" name="correo">
      </div>
      
      <div class="mb-2 text-start">
        <label class="form-label fw-bold text-secondary small">Contraseña</label>
        <div class="input-group shadow-sm" style="border-radius: 8px; overflow: hidden;">
          <input [type]="mostrarPassword ? 'text' : 'password'" class="form-control border-end-0" placeholder="********" [(ngModel)]="password" name="password">
          <button class="btn btn-outline-secondary border-start-0 bg-white" type="button" (click)="mostrarPassword = !mostrarPassword">
            {{ mostrarPassword ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <ul class="list-unstyled small mb-3 text-start ms-1" style="font-size: 0.85rem;">
        <li [style.color]="tieneMinimoOchoCharacters ? '#198754' : '#dc3545'" class="mb-1">
          {{ tieneMinimoOchoCharacters ? '✅' : '❌' }} Mínimo 8 caracteres
        </li>
        <li [style.color]="tieneMayuscula ? '#198754' : '#dc3545'" class="mb-1">
          {{ tieneMayuscula ? '✅' : '❌' }} Al menos una letra mayúscula
        </li>
        <li [style.color]="tieneNumero ? '#198754' : '#dc3545'">
          {{ tieneNumero ? '✅' : '❌' }} Al menos un número
        </li>
      </ul>

      <div class="mb-4 text-start">
        <label class="form-label fw-bold text-secondary small">Repetir Contraseña</label>
        <div class="input-group shadow-sm" style="border-radius: 8px; overflow: hidden;">
          <input [type]="mostrarRepetirPassword ? 'text' : 'password'" class="form-control border-end-0" placeholder="********" [(ngModel)]="repetirPassword" name="repetirPassword" (keydown.enter)="registrar()">
          <button class="btn btn-outline-secondary border-start-0 bg-white" type="button" (click)="mostrarRepetirPassword = !mostrarRepetirPassword">
            {{ mostrarRepetirPassword ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <button type="button" 
              class="btn w-100 fw-bold text-white mb-3 shadow-sm" 
              style="background-color: #198754; padding: 12px; border-radius: 8px;" 
              (click)="registrar()"
              [disabled]="!passwordValida || !contrasenasCoinciden">
        Registrarme
      </button>
    </form>

    <div class="d-flex align-items-center mb-3">
      <hr class="flex-grow-1">
      <span class="mx-2 text-muted small fw-bold">o regístrate con</span>
      <hr class="flex-grow-1">
    </div>

    <button type="button" class="btn btn-outline-dark w-100 mb-2 fw-bold d-flex align-items-center justify-content-center shadow-sm" style="padding: 10px; border-radius: 8px;" (click)="iniciarSesionGoogle()">
      <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" width="20" class="me-2">
      Google
    </button>

    <div class="mt-2 mb-3">
      <small class="text-muted">¿Ya tienes cuenta?</small>
      <a routerLink="/login" class="fw-bold ms-1" style="color: #198754; text-decoration: none; cursor: pointer;">
        Inicia Sesión aquí
      </a>
    </div>

    <a routerLink="/inicio" class="text-muted fw-bold" style="cursor: pointer; font-size: 0.9rem; text-decoration: none;">
      ← Volver al Inicio
    </a>
  </div>
</div>
